<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title">
  <title id="title">Digital aquarium</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#07334c"/><stop offset=".5" stop-color="#06243b"/><stop offset="1" stop-color="#03131f"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .fish1{animation:swim1 12s linear infinite}.fish2{animation:swim2 16s linear infinite}.fish3{animation:swim3 10s linear infinite}
      .bubble{animation:rise 5s linear infinite}.b2{animation-delay:-2s}.b3{animation-delay:-4s}
      @keyframes swim1{from{transform:translateX(-130px)}to{transform:translateX(1080px)}}
      @keyframes swim2{from{transform:translateX(1050px)}to{transform:translateX(-160px)}}
      @keyframes swim3{from{transform:translateX(-230px)}to{transform:translateX(1040px)}}
      @keyframes rise{from{transform:translateY(260px);opacity:0}15%{opacity:.75}to{transform:translateY(-70px);opacity:0}}
    </style>
  </defs>
  <rect width="1000" height="320" rx="14" fill="url(#water)"/>
  <path d="M0 54Q120 30 240 55T480 53T720 54T1000 48" fill="none" stroke="#55d7e5" stroke-opacity=".28" stroke-width="3"/>
  <g fill="none" stroke="#77e9f0" stroke-opacity=".5">
    <circle class="bubble" cx="130" cy="0" r="7"/><circle class="bubble b2" cx="295" cy="0" r="4"/>
    <circle class="bubble b3" cx="710" cy="0" r="8"/><circle class="bubble b2" cx="850" cy="0" r="5"/>
  </g>
  <g class="fish1" transform="translate(0 105)" fill="#7df6d7" filter="url(#glow)">
    <path d="M70 18c22-20 54-20 76 0-22 20-54 20-76 0Zm0 0L45 2v32Z"/><circle cx="132" cy="14" r="2.5" fill="#042032"/>
  </g>
  <g class="fish2" transform="translate(0 170) scale(-1 1)" fill="#bb8cff" filter="url(#glow)">
    <path d="M70 18c18-17 46-17 66 0-20 18-48 18-66 0Zm0 0L48 5v26Z"/><circle cx="124" cy="14" r="2.2" fill="#042032"/>
  </g>
  <g class="fish3" transform="translate(0 225) scale(.72)" fill="#ffcf6e">
    <path d="M70 18c18-17 46-17 66 0-20 18-48 18-66 0Zm0 0L48 5v26Z"/><circle cx="124" cy="14" r="2.2" fill="#042032"/>
  </g>
  <g fill="#0b5b62" opacity=".7">
    <path d="M40 320q-12-80 17-133-7 82 10 133Zm55 0q24-89 8-150 43 76 18 150Zm790 0q-20-88 10-145-2 87 14 145Zm55 0q28-76 15-134 38 67 10 134Z"/>
  </g>
  <path d="M0 290Q150 270 300 292T600 288T1000 286V320H0Z" fill="#031018"/>
  <g font-family="monospace" font-size="13" fill="#78dbe4">
    <text x="30" y="35">AQUARIUM.APP // QUIET MODE</text>
    <text x="782" y="35">DEPTH: 07.3 M</text>
  </g>
</svg>

