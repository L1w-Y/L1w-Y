<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Enter the event horizon</title>
  <desc id="desc">An animated black hole with a luminous accretion disk and a field of distant stars.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#11152b"/>
      <stop offset=".48" stop-color="#050711"/>
      <stop offset="1" stop-color="#010205"/>
    </radialGradient>
    <radialGradient id="hole">
      <stop offset=".58" stop-color="#000"/>
      <stop offset=".78" stop-color="#010103"/>
      <stop offset=".92" stop-color="#161021"/>
      <stop offset="1" stop-color="#ffb45d"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1=".5" x2="1" y2=".5">
      <stop stop-color="#e34b20" stop-opacity=".04"/>
      <stop offset=".15" stop-color="#ff6a2a" stop-opacity=".7"/>
      <stop offset=".36" stop-color="#ffd29a"/>
      <stop offset=".5" stop-color="#fff8df"/>
      <stop offset=".64" stop-color="#a9d8ff"/>
      <stop offset=".86" stop-color="#557ee8" stop-opacity=".68"/>
      <stop offset="1" stop-color="#2b3f91" stop-opacity=".04"/>
    </linearGradient>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="cut">
      <rect width="1200" height="520" fill="#fff"/>
      <circle cx="600" cy="260" r="100" fill="#000"/>
    </mask>
    <style>
      .stars-a{animation:driftA 28s linear infinite}
      .stars-b{animation:driftB 38s linear infinite}
      .disk-a{animation:spinA 9s linear infinite;transform-origin:600px 260px}
      .disk-b{animation:spinB 14s linear infinite;transform-origin:600px 260px}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .blink{animation:blink 2.8s ease-in-out infinite}
      @keyframes driftA{to{transform:translateX(26px)}}
      @keyframes driftB{to{transform:translateX(-34px)}}
      @keyframes spinA{to{transform:rotate(360deg)}}
      @keyframes spinB{to{transform:rotate(-360deg)}}
      @keyframes pulse{50%{opacity:.68;transform:scale(1.035)}}
      @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="1200" height="520" rx="18" fill="url(#space)"/>
  <g class="stars-a" fill="#dce6ff">
    <circle cx="62" cy="92" r="1.2"/><circle cx="145" cy="194" r=".8"/><circle cx="230" cy="64" r="1.5"/>
    <circle cx="310" cy="354" r=".8"/><circle cx="390" cy="112" r="1.1"/><circle cx="842" cy="76" r="1.1"/>
    <circle cx="930" cy="151" r=".8"/><circle cx="1020" cy="62" r="1.5"/><circle cx="1138" cy="338" r="1"/>
  </g>
  <g class="stars-b" fill="#8eaaff" opacity=".75">
    <circle cx="105" cy="404" r="1"/><circle cx="268" cy="236" r=".7"/><circle cx="352" cy="447" r="1.2"/>
    <circle cx="788" cy="420" r=".8"/><circle cx="905" cy="368" r="1.2"/><circle cx="1080" cy="225" r=".8"/>
  </g>
  <g class="blink" stroke="#dce6ff" stroke-width="1">
    <path d="M184 120h12m-6-6v12"/><path d="M1050 116h10m-5-5v10"/><path d="M922 446h12m-6-6v12"/>
  </g>

  <ellipse cx="600" cy="260" rx="425" ry="82" fill="none" stroke="#ff7a2f" stroke-width="33" stroke-opacity=".18" filter="url(#blur12)"/>
  <ellipse cx="600" cy="260" rx="402" ry="63" fill="none" stroke="url(#disk)" stroke-width="18" opacity=".9" filter="url(#glow)" mask="url(#cut)"/>

  <g class="disk-a" mask="url(#cut)" fill="none" stroke-linecap="round">
    <ellipse cx="600" cy="260" rx="370" ry="48" stroke="#fff1ce" stroke-width="5" stroke-dasharray="6 28" opacity=".86" filter="url(#glow)"/>
    <ellipse cx="600" cy="260" rx="330" ry="41" stroke="#ff8646" stroke-width="4" stroke-dasharray="42 18" opacity=".74"/>
  </g>
  <g class="disk-b" mask="url(#cut)" fill="none" stroke-linecap="round">
    <ellipse cx="600" cy="260" rx="395" ry="58" stroke="#72a1ff" stroke-width="3" stroke-dasharray="18 37" opacity=".72" filter="url(#glow)"/>
  </g>

  <g class="pulse" transform-origin="600px 260px">
    <circle cx="600" cy="260" r="124" fill="#f4a55d" opacity=".16" filter="url(#blur12)"/>
    <circle cx="600" cy="260" r="108" fill="url(#hole)" filter="url(#glow)"/>
    <circle cx="600" cy="260" r="94" fill="#000"/>
  </g>

  <path d="M498 245c25-78 68-119 102-119s77 41 102 119" fill="none" stroke="#ffe5bd" stroke-width="8" stroke-linecap="round" opacity=".82" filter="url(#glow)"/>
  <path d="M508 276c29 68 62 98 92 98s63-30 92-98" fill="none" stroke="#628cff" stroke-width="5" stroke-linecap="round" opacity=".55" filter="url(#glow)"/>

  <text x="600" y="466" fill="#aeb7d5" font-family="monospace" font-size="13" text-anchor="middle" letter-spacing="7">EVENT HORIZON // ACTIVE</text>
  <text x="52" y="48" fill="#69718d" font-family="monospace" font-size="11" letter-spacing="3">GRAVITY WELL 07</text>
  <text x="1148" y="48" fill="#69718d" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="3">SIGNAL LOST</text>
</svg>

