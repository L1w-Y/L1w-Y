<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Midnight System Console</title>
  <desc id="desc">A retro midnight terminal floating over a pixel city.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050817"/>
      <stop offset=".55" stop-color="#101a3c"/>
      <stop offset="1" stop-color="#1d2450"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1730" stop-opacity=".96"/>
      <stop offset="1" stop-color="#090d1c" stop-opacity=".98"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#6d79b9" stroke-opacity=".07"/>
    </pattern>
    <style>
      .star{animation:twinkle 3s ease-in-out infinite}.star.s2{animation-delay:-1s}.star.s3{animation-delay:-2s}
      .cursor{animation:blink 1.05s step-end infinite}.scan{animation:scan 7s linear infinite}
      @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
      @keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(370px)}}
    </style>
  </defs>

  <rect width="1000" height="420" rx="18" fill="url(#sky)"/>
  <rect width="1000" height="420" rx="18" fill="url(#grid)"/>

  <g fill="#dfe8ff">
    <circle class="star" cx="80" cy="55" r="1.8"/><circle class="star s2" cx="155" cy="105" r="1.2"/>
    <circle class="star s3" cx="260" cy="52" r="1.5"/><circle class="star s2" cx="680" cy="60" r="1.6"/>
    <circle class="star" cx="790" cy="112" r="1.2"/><circle class="star s3" cx="915" cy="48" r="1.7"/>
    <path class="star s2" d="M860 82h12m-6-6v12" stroke="#dfe8ff" stroke-width="1.3"/>
  </g>

  <path d="M840 45a34 34 0 1 0 30 52 29 29 0 1 1-30-52Z" fill="#f7efd2" filter="url(#glow)"/>

  <g opacity=".86">
    <path d="M0 330V250h60v-45h42v125h35v-72h78v72h28V178h70v152h31v-99h74v99h38v-61h55v61h30V196h87v134h40v-91h61v91h25v-144h80v144h30v-67h75v67Z" fill="#080d20"/>
    <g fill="#6ee7ff" opacity=".55">
      <path d="M22 273h8v8h-8zm20 0h8v8h-8zm30-42h8v8h-8zm122 53h8v8h-8zm72-72h9v9h-9zm23 0h9v9h-9zm83 45h8v8h-8zm105 37h8v8h-8zm88-72h9v9h-9zm23 0h9v9h-9zm102 44h8v8h-8zm84-53h9v9h-9zm25 0h9v9h-9z"/>
    </g>
  </g>

  <rect x="135" y="68" width="730" height="270" rx="12" fill="#050817" opacity=".58" stroke="#8fa5ff" stroke-opacity=".3"/>
  <rect x="151" y="84" width="698" height="238" rx="8" fill="url(#window)" stroke="#697ad1" stroke-opacity=".48"/>
  <rect x="151" y="84" width="698" height="35" rx="8" fill="#171f42"/>
  <circle cx="174" cy="101.5" r="5" fill="#ff6f91"/><circle cx="193" cy="101.5" r="5" fill="#ffd166"/><circle cx="212" cy="101.5" r="5" fill="#66e3c4"/>
  <text x="500" y="106" fill="#9dadde" font-family="monospace" font-size="13" text-anchor="middle" letter-spacing="3">MIDNIGHT SYSTEM / CHANNEL 07</text>

  <g font-family="monospace">
    <text x="185" y="157" fill="#65fbd2" font-size="17">&gt; boot midnight_system</text>
    <text x="185" y="190" fill="#8193ce" font-size="15">loading stars .................. done</text>
    <text x="185" y="220" fill="#8193ce" font-size="15">opening quiet channel ......... done</text>
    <text x="185" y="250" fill="#8193ce" font-size="15">searching for unknown signals . listening</text>
    <text x="185" y="290" fill="#cbd5ff" font-size="16">SELECT A FILE BELOW TO CONTINUE</text>
    <rect class="cursor" x="511" y="275" width="10" height="19" fill="#65fbd2"/>
  </g>

  <rect class="scan" x="158" y="90" width="684" height="2" fill="#7fffe2" opacity=".18"/>
  <path d="M0 365Q170 330 345 370T690 368T1000 355V420H0Z" fill="#050817" opacity=".85"/>
  <path d="M0 365Q170 330 345 370T690 368T1000 355" fill="none" stroke="#536cff" stroke-opacity=".45" stroke-width="2"/>
</svg>

