<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title">
  <title id="title">Lunar observation channel</title>
  <defs>
    <radialGradient id="space">
      <stop stop-color="#1d2758"/><stop offset="1" stop-color="#050817"/>
    </radialGradient>
    <radialGradient id="moon">
      <stop stop-color="#fffbed"/><stop offset=".7" stop-color="#d8dded"/><stop offset="1" stop-color="#8d97b9"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .orbit{stroke-dasharray:5 10;animation:orbit 18s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}
      @keyframes orbit{to{stroke-dashoffset:-180}}@keyframes pulse{50%{opacity:.35}}
    </style>
  </defs>
  <rect width="1000" height="300" rx="14" fill="url(#space)"/>
  <g fill="#dce6ff" opacity=".7">
    <circle cx="92" cy="62" r="1.5"/><circle cx="185" cy="205" r="1"/><circle cx="320" cy="58" r="1.4"/>
    <circle cx="690" cy="73" r="1.2"/><circle cx="806" cy="210" r="1.4"/><circle cx="914" cy="82" r="1"/>
  </g>
  <ellipse class="orbit" cx="500" cy="150" rx="278" ry="92" fill="none" stroke="#9aaeff" stroke-opacity=".48" stroke-width="2"/>
  <circle cx="500" cy="150" r="82" fill="#a8b4e7" opacity=".16" filter="url(#glow)"/>
  <circle cx="500" cy="150" r="64" fill="url(#moon)" filter="url(#glow)"/>
  <g fill="#7f89aa" opacity=".42">
    <circle cx="475" cy="125" r="11"/><circle cx="527" cy="139" r="8"/><circle cx="493" cy="176" r="13"/><circle cx="537" cy="178" r="5"/>
  </g>
  <circle cx="224" cy="150" r="5" fill="#65fbd2" filter="url(#glow)"/>
  <circle class="pulse" cx="224" cy="150" r="13" fill="none" stroke="#65fbd2"/>
  <g font-family="monospace" font-size="13" fill="#9eb0e8">
    <text x="35" y="38">LUNAR OBSERVATION // ACTIVE</text>
    <text x="35" y="270">ORBIT 07-A</text>
    <text x="835" y="270">SIGNAL: CLEAR</text>
  </g>
</svg>

