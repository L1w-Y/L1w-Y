<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title">
  <title id="title">Secret file</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1a0d29"/><stop offset=".48" stop-color="#090817"/><stop offset="1" stop-color="#082a2d"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.door{animation:open 4s ease-in-out infinite alternate}.spark{animation:blink 1.8s ease-in-out infinite}@keyframes open{to{transform:translateX(-12px);opacity:.6}}@keyframes blink{50%{opacity:.15}}</style>
  </defs>
  <rect width="1000" height="280" rx="14" fill="url(#bg)"/>
  <g class="spark" fill="#b6fff0" filter="url(#glow)">
    <circle cx="160" cy="73" r="2"/><circle cx="820" cy="192" r="2"/><circle cx="733" cy="58" r="1.7"/>
  </g>
  <rect x="420" y="46" width="160" height="196" rx="6" fill="#080713" stroke="#8f79e8" stroke-width="2"/>
  <path class="door" d="M437 61h126v166H437Z" fill="#151333" stroke="#8f79e8" transform-origin="437px 144px"/>
  <circle cx="545" cy="145" r="5" fill="#7af7df" filter="url(#glow)"/>
  <path d="M500 104l10 21 23 3-17 16 4 23-20-11-20 11 4-23-17-16 23-3Z" fill="#ffe3a3" opacity=".82" filter="url(#glow)"/>
  <text x="500" y="265" fill="#b9b5dd" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="3">YOU FOUND THE QUIET DOOR</text>
</svg>
